version: '3.8'

services:
  # MySQL Datenbank Container
  mysql-db:
    image: mysql:8.0
    container_name: onlineshop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: onlineshop_db
      MYSQL_USER: onlineshop_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: