spring:
  application:
    name: OnlineShop

  # Активируем профиль dev по умолчанию для локальной разработки
  profiles:
    active: dev

  # ==========================================
  # Datenbank-Konfiguration (wird durch .env überschrieben)
  # ==========================================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onlineshop_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:onlineshop_user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # JPA / Hibernate Konfiguration
  # ==========================================
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # dialect wird ab Spring Boot 3.x automatisch erkannt, nicht explizit setzen

  # ==========================================
  # Flyway Migrationen (V1__..., V2__...)
  # ==========================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # Wichtig, falls die DB schon manuell angefasst wurde

  # ==========================================
  # Datei-Upload Konfiguration
  # ==========================================
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ==========================================
# Anwendungsspezifische Eigenschaften
# ==========================================
app:
  upload-dir: ${APP_UPLOAD_DIR:./dev-uploads}

# ==========================================
# Logging (SLF4J / Logback) gemäß Lastenheft
# ==========================================
logging:
  level:
    root: INFO
    com.ibb.onlineshop: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

---
# ==========================================
# Profil: dev (Lokale Entwicklung)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true

---
# ==========================================
# Profil: prod (Produktion / Docker)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate # In Prod nur validieren, nicht ändern!
  flyway:
    enabled: true
  logging:
    level:
      root: WARN
      com.ibb.onlineshop: INFO
      org.hibernate.SQL: WARN