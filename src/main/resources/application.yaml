spring:
  application:
    name: onlineshop

  # ==========================================
  # Datenbank-Konfiguration (wird durch .env überschrieben)
  # ==========================================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onlineshop_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:onlineshop_user}
    password: ${DB_PASSWORD:SecurePassword_2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # JPA / Hibernate Konfiguration
  # ==========================================
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # ==========================================
  # Flyway Migrationen (V1__..., V2__...)
  # ==========================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==========================================
  # Datei-Upload Konfiguration (Anforderung /F09/)
  # ==========================================
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # ==========================================
  # Fehlerbehandlung (Erforderlich für GlobalExceptionHandler / NoHandlerFoundException)
  # ==========================================
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# ==========================================
# Anwendungsspezifische Eigenschaften
# ==========================================
app:
  upload-dir: ${APP_UPLOAD_DIR:./dev-uploads}

# ==========================================
# Logging (SLF4J / Logback) - Anforderung /F18/
# ==========================================
logging:
  level:
    root: INFO
    com.karpenko.onlineshop: INFO
    org.springframework.security: INFO

---
# ==========================================
# Profil: dev (Lokale Entwicklung)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.karpenko.onlineshop: DEBUG
    org.hibernate.SQL: DEBUG

---
# ==========================================
# Profil: prod (Produktion / Docker)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.karpenko.onlineshop: INFO
    org.hibernate.SQL: WARN

---
# ==========================================
# Profil: test (Für JUnit / MockMvc Tests)
# ==========================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    com.karpenko.onlineshop: WARN