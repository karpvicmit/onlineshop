spring:
  application:
    name: onlineshop

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            client-name: Google

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: never

logging:
  level:
    root: INFO
    com.karpenko.onlineshop: INFO

app:
  init:
    admin:
      email: ${ADMIN_EMAIL:admin@onlineshop.de}
      password: ${ADMIN_PASSWORD:AdminSecure2026!}