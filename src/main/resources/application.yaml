spring:
  application:
    name: OnlineShop

  profiles:
    active: dev

  # ==========================================
  # Datenbank-Konfiguration
  # ==========================================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onlineshop_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:onlineshop_user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # JPA / Hibernate Konfiguration
  # ==========================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # ==========================================
  # Flyway Migrationen
  # ==========================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate: true

  # ==========================================
  # Datei-Upload Konfiguration
  # ==========================================
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # ==========================================
  # Anwendungsspezifische Eigenschaften
  # ==========================================
  app:
    upload-dir: ${APP_UPLOAD_DIR:./dev-uploads}

# ==========================================
# Logging (SLF4J / Logback)
# ==========================================
logging:
  level:
    root: INFO
    com.karpenko.onlineshop: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

---
# ==========================================
# Profil: dev (Lokale Entwicklung)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev

---
# ==========================================
# Profil: prod (Produktion / Docker)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  logging:
    level:
      root: WARN
      com.karpenko.onlineshop: INFO
      org.flywaydb: INFO

---
# ==========================================
# Oauth: Google Login
# ==========================================
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub