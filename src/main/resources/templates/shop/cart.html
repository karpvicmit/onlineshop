<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Warenkorb')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container mt-4">
    <h2 class="mb-4"><i class="fas fa-shopping-cart me-2"></i>Ihr Warenkorb</h2>

    <div th:if="${cart != null and !cart.items.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col">Produkt</th>
                    <th scope="col" class="text-center">Preis</th>
                    <th scope="col" class="text-center">Menge</th>
                    <th scope="col" class="text-end">Gesamt</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cart.items}">
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:src="${item.product.imageUrl != null ? item.product.imageUrl : '/images/placeholder.jpg'}"
                                 class="rounded me-3" style="width: 60px; height: 60px; object-fit: cover;">
                            <div>
                                <h6 class="mb-0" th:text="${item.product.name}">Produkt Name</h6>
                                <small class="text-muted" th:text="'Lager: ' + ${item.product.stock}">Lagerbestand</small>
                            </div>
                        </div>
                    </td>
                    <td class="text-center" th:text="${#numbers.formatDecimal(item.product.price, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>
                    <td class="text-center">
                        <form th:action="@{/shop/cart/update}" method="post" class="d-flex justify-content-center">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1" th:max="${item.product.stock}"
                                   class="form-control form-control-sm text-center" style="width: 70px;" onchange="this.form.submit()">
                        </form>
                    </td>
                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>
                    <td class="text-end">
                        <form th:action="@{/shop/cart/remove}" method="post">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="row mt-4">
            <div class="col-md-6 offset-md-6">
                <div class="card bg-light">
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Zwischensumme:</span>
                            <span th:text="${#numbers.formatDecimal(totalPrice, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 fw-bold fs-5">
                            <span>Gesamtbetrag:</span>
                            <span class="text-primary" th:text="${#numbers.formatDecimal(totalPrice, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</span>
                        </div>
                        <a th:href="@{/shop/checkout}" class="btn btn-success w-100 py-2">
                            Zur Kasse gehen <i class="fas fa-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${cart == null or cart.items.isEmpty()}" class="text-center py-5">
        <i class="fas fa-shopping-basket fa-4x text-muted mb-3"></i>
        <h3>Ihr Warenkorb ist leer</h3>
        <p class="text-muted">Entdecken Sie unsere Produkte und legen Sie Ihre Favoriten in den Warenkorb.</p>
        <a th:href="@{/shop/products}" class="btn btn-primary mt-2">Jetzt einkaufen</a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
