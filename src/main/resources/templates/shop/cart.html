<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Warenkorb')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1>Ihr Warenkorb</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${cart.items.isEmpty()}" class="alert alert-info">
        Ihr Warenkorb ist leer.
        <a th:href="@{/shop/products}" class="alert-link">Weiter einkaufen</a>
    </div>

    <div th:if="${!cart.items.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>Produkt</th>
                    <th>Einzelpreis</th>
                    <th>Menge</th>
                    <th>Zwischensumme</th>
                    <th>Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cart.items}">
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:src="${item.productImageUrl ?: '/images/placeholder.jpg'}"
                                 th:alt="${item.productName}"
                                 class="me-3"
                                 style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px;">
                            <div>
                                <strong th:text="${item.productName}">Produktname</strong>
                                <br>
                                <small class="text-muted">
                                    ID: <span th:text="${item.productId}">1</span>
                                </small>
                            </div>
                        </div>
                    </td>

                    <td>
                        <span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</span> €
                    </td>

                    <td>
                        <form th:action="@{/shop/cart/update}" method="post" class="d-inline">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <div class="input-group" style="width: 120px;">
                                <input type="number" name="quantity"
                                       th:value="${item.quantity}"
                                       min="1" max="99"
                                       class="form-control form-control-sm"
                                       onchange="this.form.submit()">
                            </div>
                        </form>
                    </td>

                    <td>
                        <strong th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}">0.00</strong> €
                    </td>

                    <td>
                        <form th:action="@{/shop/cart/remove}" method="post" class="d-inline">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Entfernen
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
                <tfoot class="table-light">
                <tr>
                    <td colspan="3" class="text-end"><strong>Gesamt:</strong></td>
                    <td colspan="2">
                        <strong class="fs-5" th:text="${#numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT')}">0.00</strong> €
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/shop/products}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Weiter einkaufen
            </a>
            <a th:href="@{/shop/checkout}" class="btn btn-primary btn-lg">
                Zur Kasse <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
