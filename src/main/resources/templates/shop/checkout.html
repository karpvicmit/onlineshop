<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Kasse')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-credit-card me-2"></i>Kasse / Checkout</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/shop/checkout/confirm}" method="post">

                        <!-- ============ SHIPPING METHOD ============ -->
                        <div class="mb-4">
                            <h5 class="mb-3"><i class="bi bi-truck me-2"></i>Versandart wählen</h5>
                            <div class="list-group">
                                <label class="list-group-item list-group-item-action d-flex gap-3 py-3" style="cursor: pointer;">
                                    <input class="form-check-input flex-shrink-0" type="radio"
                                           name="shippingMethod" value="STANDARD" checked required>
                                    <div class="d-flex gap-2 w-100 justify-content-between">
                                        <div>
                                            <h6 class="mb-0">Standardversand</h6>
                                            <small class="text-muted">Lieferung in 3–5 Werktagen</small>
                                        </div>
                                        <strong class="text-primary">4,99 €</strong>
                                    </div>
                                </label>
                                <label class="list-group-item list-group-item-action d-flex gap-3 py-3" style="cursor: pointer;">
                                    <input class="form-check-input flex-shrink-0" type="radio"
                                           name="shippingMethod" value="EXPRESS" required>
                                    <div class="d-flex gap-2 w-100 justify-content-between">
                                        <div>
                                            <h6 class="mb-0">Expressversand</h6>
                                            <small class="text-muted">Lieferung am nächsten Werktag</small>
                                        </div>
                                        <strong class="text-primary">9,99 €</strong>
                                    </div>
                                </label>
                                <label class="list-group-item list-group-item-action d-flex gap-3 py-3" style="cursor: pointer;">
                                    <input class="form-check-input flex-shrink-0" type="radio"
                                           name="shippingMethod" value="ABHOLUNG" required>
                                    <div class="d-flex gap-2 w-100 justify-content-between">
                                        <div>
                                            <h6 class="mb-0">Selbstabholung</h6>
                                            <small class="text-muted">Kostenlose Abholung im Lager</small>
                                        </div>
                                        <strong class="text-success">Kostenlos</strong>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- ============ PAYMENT METHOD ============ -->
                        <div class="mb-4">
                            <h5 class="mb-3"><i class="bi bi-credit-card me-2"></i>Zahlungsart wählen</h5>
                            <div class="list-group">
                                <label class="list-group-item list-group-item-action d-flex gap-3 py-3" style="cursor: pointer;">
                                    <input class="form-check-input flex-shrink-0" type="radio"
                                           name="paymentProvider" value="VORKASSE" checked required>
                                    <div class="d-flex gap-2 w-100 justify-content-between">
                                        <div>
                                            <h6 class="mb-0">Vorkasse</h6>
                                            <small class="text-muted">Bezahlung vor Versand per Überweisung</small>
                                        </div>
                                    </div>
                                </label>
                                <label class="list-group-item list-group-item-action d-flex gap-3 py-3" style="cursor: pointer;">
                                    <input class="form-check-input flex-shrink-0" type="radio"
                                           name="paymentProvider" value="STRIPE" required>
                                    <div class="d-flex gap-2 w-100 justify-content-between">
                                        <div>
                                            <h6 class="mb-0">Kreditkarte / PayPal (Stripe)</h6>
                                            <small class="text-muted">Sichere Zahlung per Kreditkarte oder PayPal</small>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- ============ DELIVERY ADDRESS ============ -->
                        <div class="mb-4">
                            <h5 class="mb-3"><i class="bi bi-geo-alt me-2"></i>Lieferadresse</h5>
                            <div class="alert alert-light border">
                                <strong th:text="${user.firstName + ' ' + user.lastName}">Max Mustermann</strong><br>
                                <span th:text="${user.address}">Adresse</span><br>
                                <small class="text-muted" th:text="${user.email}">email</small>
                            </div>
                            <a th:href="@{/profile}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i> Adresse ändern
                            </a>
                        </div>

                        <hr>

                        <!-- ============ TERMS ============ -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
                            <label class="form-check-label" for="acceptTerms">
                                Ich akzeptiere die
                                <a th:href="@{/agb}" target="_blank">AGB</a> und habe die
                                <a th:href="@{/datenschutz}" target="_blank">Datenschutzerklärung</a>
                                zur Kenntnis genommen.
                            </label>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/shop/cart}" class="btn btn-outline-secondary me-md-2">
                                Zurück zum Warenkorb
                            </a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check-circle me-1"></i> Kostenpflichtig bestellen
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
