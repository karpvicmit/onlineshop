<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Kasse')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="page-container">
    <div class="page-title-section">
        <h1><i class="bi bi-bag-check me-2"></i>Kasse</h1>
        <p>Überprüfen Sie Ihre Bestellung und schließen Sie den Kauf ab</p>
    </div>

    <form th:action="@{/shop/checkout/confirm}" method="post">
        <div class="checkout-layout">
            <div class="checkout-steps">
                <div class="checkout-step">
                    <div class="checkout-step-header">
                        <span class="checkout-step-number">1</span>
                        <h2 class="checkout-step-title">Versandart</h2>
                    </div>
                    <div class="checkout-step-body">
                        <label class="checkout-option">
                            <input type="radio" name="shippingMethod" value="STANDARD" checked required>
                            <div class="checkout-option-info">
                                <div class="checkout-option-name">Standardversand</div>
                                <div class="checkout-option-desc">Lieferung in 3–5 Werktagen</div>
                            </div>
                            <span class="checkout-option-price">4,99 €</span>
                        </label>
                        <label class="checkout-option">
                            <input type="radio" name="shippingMethod" value="EXPRESS" required>
                            <div class="checkout-option-info">
                                <div class="checkout-option-name">Expressversand</div>
                                <div class="checkout-option-desc">Lieferung am nächsten Werktag</div>
                            </div>
                            <span class="checkout-option-price">9,99 €</span>
                        </label>
                        <label class="checkout-option">
                            <input type="radio" name="shippingMethod" value="ABHOLUNG" required>
                            <div class="checkout-option-info">
                                <div class="checkout-option-name">Selbstabholung</div>
                                <div class="checkout-option-desc">Kostenlose Abholung im Lager</div>
                            </div>
                            <span class="checkout-option-price free">Kostenlos</span>
                        </label>
                    </div>
                </div>

                <div class="checkout-step">
                    <div class="checkout-step-header">
                        <span class="checkout-step-number">2</span>
                        <h2 class="checkout-step-title">Zahlungsart</h2>
                    </div>
                    <div class="checkout-step-body">
                        <label class="checkout-option">
                            <input type="radio" name="paymentProvider" value="VORKASSE" checked required>
                            <div class="checkout-option-info">
                                <div class="checkout-option-name">Vorkasse</div>
                                <div class="checkout-option-desc">Bezahlung vor Versand per Überweisung</div>
                            </div>
                        </label>
                        <label class="checkout-option">
                            <input type="radio" name="paymentProvider" value="RECHNUNG" required>
                            <div class="checkout-option-info">
                                <div class="checkout-option-name">Rechnung</div>
                                <div class="checkout-option-desc">Bezahlung innerhalb von 14 Tagen nach Erhalt</div>
                            </div>
                        </label>
                        <label class="checkout-option">
                            <input type="radio" name="paymentProvider" value="STRIPE" required>
                            <div class="checkout-option-info">
                                <div class="checkout-option-name">Kreditkarte / PayPal</div>
                                <div class="checkout-option-desc">Sichere Zahlung per Kreditkarte oder PayPal</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="checkout-step">
                    <div class="checkout-step-header">
                        <span class="checkout-step-number">3</span>
                        <h2 class="checkout-step-title">Lieferadresse</h2>
                    </div>
                    <div class="checkout-step-body">
                        <div class="checkout-address-card">
                            <div class="checkout-address-icon">
                                <i class="bi bi-geo-alt"></i>
                            </div>
                            <div class="checkout-address-info">
                                <div class="checkout-address-name"
                                     th:text="${user.firstName + ' ' + user.lastName}">Max Mustermann</div>
                                <div class="checkout-address-text" th:text="${user.address}">Adresse</div>
                                <div class="checkout-address-email" th:text="${user.email}">email</div>
                            </div>
                            <a th:href="@{/profile}" class="checkout-address-edit">
                                <i class="bi bi-pencil"></i> Ändern
                            </a>
                        </div>
                    </div>
                </div>

                <div class="checkout-step">
                    <div class="checkout-step-body">
                        <div class="checkout-terms">
                            <input type="checkbox" id="acceptTerms" required>
                            <label for="acceptTerms">
                                Ich akzeptiere die
                                <a th:href="@{/agb}" target="_blank">AGB</a> und habe die
                                <a th:href="@{/datenschutz}" target="_blank">Datenschutzerklärung</a>
                                zur Kenntnis genommen.
                            </label>
                        </div>

                        <div class="checkout-actions">
                            <a th:href="@{/shop/cart}" class="checkout-back-btn">
                                <i class="bi bi-arrow-left"></i> Zurück zum Warenkorb
                            </a>
                            <button type="submit" class="checkout-submit-btn">
                                <i class="bi bi-lock"></i> Kostenpflichtig bestellen
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cart-summary-sidebar">
                <div class="checkout-summary-card">
                    <div class="checkout-summary-header">Bestellübersicht</div>
                    <div class="checkout-summary-body" style="padding: var(--space-5);">
                        <div class="cart-summary-row">
                            <span>Zwischensumme</span>
                            <span class="value" th:text="${#numbers.formatDecimal(cart != null ? cart.total : 0, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
                        </div>
                        <div class="cart-summary-row total">
                            <span>Gesamt</span>
                            <span th:text="${#numbers.formatDecimal(cart != null ? cart.finalTotal : 0, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    document.querySelectorAll('.checkout-option input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const group = this.closest('.checkout-step-body');
            group.querySelectorAll('.checkout-option').forEach(opt => opt.classList.remove('selected'));
            this.closest('.checkout-option').classList.add('selected');
        });
        if (radio.checked) {
            radio.closest('.checkout-option').classList.add('selected');
        }
    });
</script>
</body>
</html>
