<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Produktkatalog')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-funnel"></i> Filter</h5>

            <form th:action="@{/shop/products}" method="get" id="filterForm">
                <div class="row g-3">

                    <div class="col-md-5">
                        <label for="searchQuery" class="form-label">Suche</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchQuery" name="q"
                                   th:value="${searchQuery}" placeholder="Produktname eingeben...">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <label for="categorySelect" class="form-label">Kategorie</label>
                        <select class="form-select" id="categorySelect" name="category"
                                onchange="submitFormWithCategory(this.value)">
                            <option value="">Alle Kategorien</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.slug}"
                                    th:text="${cat.name}"
                                    th:selected="${cat.slug == selectedCategory}">
                                Kategorie Name
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <a th:href="@{/shop/products}" class="btn btn-outline-secondary w-100" title="Filter zurücksetzen">
                            <i class="bi bi-x-lg"></i> Zurücksetzen
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Produktkatalog</h3>
        <span class="text-muted" th:text="${totalItems} + ' Produkte gefunden'">0 Produkte gefunden</span>
    </div>

    <div class="row g-4">
        <div class="col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                     th:src="@{${product.imageUrl}}"
                     class="card-img-top" alt="Produktbild" style="height: 200px; object-fit: cover;">
                <div th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                     class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
                    <i class="bi bi-image text-muted fs-1"></i>
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${product.name}">Produkt Name</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${product.description}">Beschreibung...</p>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-bold text-primary" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">0.00 €</span>
                        <span th:if="${product.stock > 0}" class="badge bg-success">Auf Lager</span>
                        <span th:unless="${product.stock > 0}" class="badge bg-danger">Ausverkauft</span>
                    </div>

                    <a th:href="@{/shop/products/{id}(id=${product.id})}" class="btn btn-outline-primary w-100 mt-3">
                        Details ansehen
                    </a>
                </div>
            </div>
        </div>

        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(products)}">
            <i class="bi bi-search display-1 text-muted"></i>
            <h4 class="mt-3 text-muted">Keine Produkte gefunden.</h4>
            <a th:href="@{/shop/products}" class="btn btn-primary mt-2">Alle Filter zurücksetzen</a>
        </div>
    </div>

    <!-- Пагинация -->
    <div class="mt-5" th:if="${totalPages > 1}">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/shop/products(page=${currentPage - 1}, q=${searchQuery}, category=${selectedCategory})}">
                        &laquo; Zurück
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/shop/products(page=${i}, q=${searchQuery}, category=${selectedCategory})}"
                       th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/shop/products(page=${currentPage + 1}, q=${searchQuery}, category=${selectedCategory})}">
                        Weiter &raquo;
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<script>
    function submitFormWithCategory(selectedCategory) {
        const form = document.getElementById('filterForm');
        const searchInput = document.getElementById('searchQuery');

        const currentSearch = searchInput.value.trim();

        let url = '/shop/products?';
        if (selectedCategory) {
            url += 'category=' + encodeURIComponent(selectedCategory) + '&';
        }
        if (currentSearch) {
            url += 'q=' + encodeURIComponent(currentSearch);
        }

        window.location.href = url;
    }
</script>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
