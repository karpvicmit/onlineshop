<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container mt-5">
    <div class="row">
        <!-- Изображение -->
        <div class="col-md-6">
            <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/placeholder.jpg'}"
                 class="img-fluid rounded shadow" alt="Produktdetail">
        </div>

        <!-- Информация -->
        <div class="col-md-6">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/shop/products}">Produkte</a></li>
                    <li class="breadcrumb-item active" th:text="${product.name}">Detail</li>
                </ol>
            </nav>

            <h1 class="display-5" th:text="${product.name}">Produkt Name</h1>

            <div class="mb-3">
                <span class="h2 text-primary" th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</span>
                <span class="ms-3 badge bg-secondary" th:text="'Kategorie: ' + ${product.categoryName}">Kategorie</span>
            </div>

            <p class="lead" th:text="${product.description}">Ausführliche Beschreibung des Produkts...</p>

            <div class="card bg-light mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <strong>Lagerbestand:</strong>
                        <span th:text="${product.stock}">0</span>
                    </div>

                    <!-- Форма добавления в корзину -->
                    <form th:action="@{/shop/cart/add}" method="post" sec:authorize="isAuthenticated()">
                        <input type="hidden" name="productId" th:value="${product.id}">

                        <div class="input-group mb-3" th:if="${product.stock > 0}">
                            <span class="input-group-text">Menge</span>
                            <input type="number" class="form-control" name="quantity" value="1" min="1" th:max="${product.stock}">
                            <button class="btn btn-success" type="submit">
                                <i class="fas fa-cart-plus me-2"></i>In den Warenkorb
                            </button>
                        </div>

                        <div th:if="${product.stock <= 0}" class="alert alert-warning mb-0">
                            Dieses Produkt ist derzeit nicht auf Lager.
                        </div>
                    </form>

                    <div class="mt-3" sec:authorize="isAuthenticated()">

                        <form th:action="@{/shop/favorites/toggle/{id}(id=${product.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="far fa-heart"></i> Zu Favoriten hinzufügen / entfernen
                            </button>
                        </form>
                    </div>

                    <div sec:authorize="!isAuthenticated()" class="alert alert-info">
                        Bitte <a th:href="@{/login}">melden Sie sich an</a>, um dieses Produkt in den Warenkorb zu legen.
                    </div>

                    <!-- Кнопка Избранное (Wunschkriterium /F08/) -->
                    <div class="mt-3" sec:authorize="isAuthenticated()">
                        <form th:action="@{/shop/favorites/toggle/{id}(id=${product.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="far fa-heart"></i> Zu Favoriten hinzufügen
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
