<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container mt-4">
    <h2 class="mb-4"><i class="fas fa-heart me-2 text-danger"></i>Meine Favoriten</h2>

    <div th:if="${favorites != null and !favorites.isEmpty()}">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="fav : ${favorites}">
                <div class="card h-100 product-card shadow-sm">
                    <img th:src="${fav.product.imageUrl != null ? fav.product.imageUrl : '/images/placeholder.jpg'}"
                         class="card-img-top" alt="Produktbild">

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${fav.product.name}">Produkt Name</h5>
                        <p class="card-text text-muted small" th:text="${#strings.abbreviate(fav.product.description, 60)}">Beschreibung...</p>

                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="h5 mb-0 text-primary" th:text="${#numbers.formatDecimal(fav.product.price, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</span>
                            </div>

                            <div class="d-grid gap-2">
                                <a th:href="@{/shop/products/{id}(id=${fav.product.id})}" class="btn btn-outline-dark btn-sm">
                                    Details ansehen
                                </a>
                                <form th:action="@{/shop/favorites/toggle/{id}(id=${fav.product.id})}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                        <i class="fas fa-trash-alt me-1"></i> Entfernen
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${favorites == null or favorites.isEmpty()}" class="text-center py-5">
        <i class="far fa-heart fa-4x text-muted mb-3"></i>
        <h3>Ihre Favoritenliste ist leer</h3>
        <p class="text-muted">Markieren Sie Produkte mit dem Herz-Icon, um sie hier zu speichern.</p>
        <a th:href="@{/shop/products}" class="btn btn-primary mt-2">Jetzt stöbern</a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
