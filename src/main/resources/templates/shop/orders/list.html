<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{orders.title})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="page-container">
    <div class="page-title-section">
        <h1><i class="bi bi-receipt me-2"></i><span th:text="#{orders.title}">Meine Bestellungen</span></h1>
        <p th:text="#{orders.subtitle}">Übersicht über alle Ihre Bestellungen</p>
    </div>
    <div th:if="${orders != null and !orders.isEmpty()}" class="orders-list">
        <div th:each="order : ${orders}" class="order-card">
            <div class="order-card-header">
                <div>
                    <span class="order-card-id" th:text="#{orders.card.order} + ' #' + ${order.id}">#123</span>
                    <span class="order-card-date ms-3" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}">01.01.2026</span>
                </div>
                <span class="order-card-status" th:switch="${order.status}">
                    <span th:case="NEW" th:text="#{orderStatus.NEW}">Neu</span>
                    <span th:case="CONFIRMED" th:text="#{orderStatus.CONFIRMED}">Bestätigt</span>
                    <span th:case="SHIPPED" th:text="#{orderStatus.SHIPPED}">Versendet</span>
                    <span th:case="CANCELLED" th:text="#{orderStatus.CANCELLED}">Storniert</span>
                </span>
            </div>
            <div class="order-card-body">
                <div class="order-card-items">
                    <div th:each="item, iterStat : ${order.orderItems}" th:if="${iterStat.index < 3}" class="order-card-item">
                        <img th:if="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty()}" th:src="${item.product.imageUrl}" class="order-card-item-image">
                        <div th:unless="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty()}" class="order-card-item-image-placeholder"><i class="bi bi-image"></i></div>
                        <div class="order-card-item-info">
                            <div class="order-card-item-name" th:text="${item.product.name}">Produktname</div>
                            <div class="order-card-item-qty" th:text="'Menge: ' + ${item.quantity} + ' × ' + ${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')} + ' €'">Menge: 1 × 0,00 €</div>
                        </div>
                        <div class="order-card-item-price" th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</div>
                    </div>
                    <div th:if="${order.orderItems.size() > 3}" class="text-muted small ps-5" th:text="#{orders.card.moreItems(${order.orderItems.size() - 3})}">+2 weitere Artikel</div>
                </div>
                <div class="order-card-footer">
                    <div>
                        <span class="text-muted small me-3"><i class="bi bi-credit-card me-1"></i><span th:text="${order.paymentMethod.displayName}">Vorkasse</span></span>
                        <span class="text-muted small"><i class="bi bi-truck me-1"></i><span th:text="${order.shippingMethod.displayName}">Standard</span></span>
                    </div>
                    <div class="order-card-total">
                        <span class="order-card-total-label" th:text="#{orders.card.total}">Gesamtbetrag</span>
                        <span class="order-card-total-value" th:text="${#numbers.formatDecimal(order.grandTotal, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
                    </div>
                    <a th:href="@{/shop/orders/{id}(id=${order.id})}" class="order-card-detail-btn">
                        <span th:text="#{orders.card.details}">Details</span> <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${orders == null or orders.isEmpty()}" class="orders-empty-state">
        <div class="orders-empty-icon"><i class="bi bi-receipt"></i></div>
        <h3 th:text="#{orders.empty.title}">Noch keine Bestellungen</h3>
        <p th:text="#{orders.empty.text}">Ihre Bestellhistorie ist leer...</p>
        <a th:href="@{/shop/products}" class="btn btn-primary btn-lg">
            <i class="bi bi-arrow-right me-2"></i><span th:text="#{orders.empty.btn}">Jetzt einkaufen</span>
        </a>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
