<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bestellhistorie')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container mt-4">
    <h2 class="mb-4"><i class="fas fa-history me-2"></i>Meine Bestellhistorie</h2>

    <div th:if="${orders != null and !orders.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col">Bestellnummer</th>
                    <th scope="col">Datum</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="text-end">Gesamtbetrag</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="'#' + ${order.id}">#123</td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                    <td>
                        <span th:switch="${order.status}" class="badge">
                                    <span th:case="NEW" class="badge bg-info text-dark">NEU</span>
                                    <span th:case="CONFIRMED" class="badge bg-primary">BESTÄTIGT</span>
                                    <span th:case="SHIPPED" class="badge bg-success">VERSENDET</span>
                                    <span th:case="CANCELLED" class="badge bg-danger">STORNIERT</span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${order.status}">STATUS</span>
                                </span>
                    </td>
                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>
                    <td class="text-end">
                        <a th:href="@{/shop/orders/{id}(id=${order.id})}" class="btn btn-outline-primary btn-sm">
                            Details ansehen
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${orders == null or orders.isEmpty()}" class="text-center py-5">
        <i class="fas fa-box-open fa-4x text-muted mb-3"></i>
        <h3>Noch keine Bestellungen</h3>
        <p class="text-muted">Ihre Bestellhistorie ist leer. Stöbern Sie durch unseren Shop!</p>
        <a th:href="@{/shop/products}" class="btn btn-primary mt-2">Jetzt einkaufen</a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
