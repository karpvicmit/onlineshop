<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bestelldetails')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-file-invoice me-2"></i>Bestelldetails #<span th:text="${order.id}">123</span></h2>
        <a th:href="@{/shop/orders}" class="btn btn-outline-secondary">Zurück zur Übersicht</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header bg-light fw-bold">Bestellinformationen</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Datum:</span>
                        <span th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}">-</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Status:</span>
                        <span th:switch="${order.status}">
                                <span th:case="NEW" class="badge bg-info text-dark">NEU</span>
                                <span th:case="CONFIRMED" class="badge bg-primary">BESTÄTIGT</span>
                                <span th:case="SHIPPED" class="badge bg-success">VERSENDET</span>
                                <span th:case="CANCELLED" class="badge bg-danger">STORNIERT</span>
                            </span>
                    </li>
                    <li class="list-group-item">
                        <strong>Lieferadresse:</strong><br>
                        <span th:text="${order.deliveryAddress}">Adresse</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Позиции заказа -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-light fw-bold">Bestellte Artikel</div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead>
                        <tr>
                            <th>Produkt</th>
                            <th class="text-center">Menge</th>
                            <th class="text-end">Einzelpreis</th>
                            <th class="text-end">Gesamt</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.product.name}">Produkt Name</td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>
                        </tr>
                        </tbody>
                        <tfoot class="table-light">
                        <tr>
                            <td colspan="3" class="text-end fw-bold">Endsumme:</td>
                            <td class="text-end fw-bold fs-5 text-primary" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
