<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="pagination(page, baseUrl)"
     th:if="${page != null and page.totalPages > 1}"
     aria-label="Page navigation">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1})}" aria-label="Previous" th:title="#{pagination.previous}">
                <span aria-hidden="true">&laquo;</span>
            </a>
        </li>

        <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:if="${i == 0 or i == page.totalPages - 1 or (i >= page.number - 2 and i <= page.number + 2)}"
            th:with="showSeparator=${i > 0 and i < page.totalPages - 1 and (i == page.number - 3 or i == page.number + 3)}"
            class="page-item"
            th:classappend="${i == page.number} ? 'active' : ''">
            <span th:if="${showSeparator}" class="page-link disabled">...</span>
            <a th:unless="${showSeparator}" class="page-link"
               th:href="@{${baseUrl}(page=${i})}"
               th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1})}" aria-label="Next" th:title="#{pagination.next}">
                <span aria-hidden="true">&raquo;</span>
            </a>
        </li>
    </ul>
</nav>
</html>
