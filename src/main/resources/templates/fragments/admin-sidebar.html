<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="admin-sidebar" class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white" style="width: 280px; min-height: 100vh;">

    <a th:href="@{/admin/dashboard}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none border-bottom pb-3">
        <i class="bi bi-shield-lock-fill fs-4 me-2 text-warning"></i>
        <span class="fs-4 fw-bold">Admin-Panel</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
            <a th:href="@{/admin/dashboard}" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'dashboard'} ? 'active bg-primary' : 'text-white-50'">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
        </li>
        <li>
            <a th:href="@{/admin/products}" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'products'} ? 'active bg-primary' : 'text-white-50'">
                <i class="bi bi-box-seam me-2"></i> Produktverwaltung
            </a>
        </li>
        <li>
            <a th:href="@{/admin/categories}" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'categories'} ? 'active bg-primary' : 'text-white-50'">
                <i class="bi bi-tags me-2"></i> Kategorien
            </a>
        </li>
        <li>
            <a th:href="@{/admin/orders}" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'orders'} ? 'active bg-primary' : 'text-white-50'">
                <i class="bi bi-receipt me-2"></i> Bestellverwaltung
            </a>
        </li>
        <li>
            <a th:href="@{/admin/users}" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'users'} ? 'active bg-primary' : 'text-white-50'">
                <i class="bi bi-people me-2"></i> Benutzerverwaltung
            </a>
        </li>
        <li>
            <a th:href="@{/admin/analytics}" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'analytics'} ? 'active bg-primary' : 'text-white-50'">
                <i class="bi bi-graph-up me-2"></i> Analyse & Statistik
            </a>
        </li>
    </ul>

    <hr class="text-white-50">

    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <strong sec:authentication="name">Admin</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
            <li>
                <span class="dropdown-item-text text-white-50 small" sec:authentication="principal.authorities">Rolle</span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item" th:href="@{/shop/products}">
                    <i class="bi bi-shop me-2"></i> Zum öffentlichen Shop
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                    <button type="submit" class="dropdown-item text-danger w-100 text-start">
                        <i class="bi bi-box-arrow-right me-2"></i> Abmelden
                    </button>
                </form>
            </li>
        </ul>
    </div>
</div>
</html>
