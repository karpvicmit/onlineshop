<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show container mt-3" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}">Erfolgsmeldung</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show container mt-3" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}">Fehlermeldung</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
</html>
