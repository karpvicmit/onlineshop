<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<footer class="site-footer" th:fragment="footer">
    <div class="footer-container">
        <div class="footer-top">
            <div class="footer-brand">
                <h3 class="footer-logo" th:text="#{navbar.brand}">OnlineShop</h3>
                <p class="footer-tagline" th:text="#{footer.tagline}">Hochwertige Produkte, zeitloses Design.</p>
            </div>
            <div class="footer-links-group">
                <div class="footer-col">
                    <h4 class="footer-heading" th:text="#{footer.shop}">Shop</h4>
                    <a th:href="@{/shop/products}" class="footer-link" th:text="#{footer.all.products}">Alle Produkte</a>
                    <a th:href="@{/shop/favorites}" class="footer-link" th:text="#{navbar.favorites}">Favoriten</a>
                    <a th:href="@{/shop/orders}" class="footer-link" th:text="#{navbar.orders}">Bestellungen</a>
                </div>
                <div class="footer-col">
                    <h4 class="footer-heading" th:text="#{footer.legal}">Rechtliches</h4>
                    <a th:href="@{/impressum}" target="_blank" class="footer-link" th:text="#{footer.impressum}">Impressum</a>
                    <a th:href="@{/agb}" target="_blank" class="footer-link" th:text="#{footer.agb}">AGB</a>
                    <a th:href="@{/datenschutz}" target="_blank" class="footer-link" th:text="#{footer.datenschutz}">Datenschutz</a>
                    <a th:href="@{/widerruf}" target="_blank" class="footer-link" th:text="#{footer.widerruf}">Widerruf</a>
                </div>
                <div class="footer-col">
                    <h4 class="footer-heading" th:text="#{footer.contact}">Kontakt</h4>
                    <p class="footer-contact">info@onlineshop.de</p>
                    <p class="footer-contact">+49 30 12345678</p>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p class="footer-copyright" th:text="#{footer.copyright}">© 2026 OnlineShop. Alle Rechte vorbehalten.</p>
            <a href="#" id="cookieSettingsLink" class="footer-link-small">
                <i class="bi bi-shield-check"></i> <span th:text="#{footer.cookie.settings}">Cookie-Einstellungen</span>
            </a>
        </div>
    </div>
    <div th:replace="~{fragments/cookie-banner :: cookie-banner}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/fragments/cookie-settings.js}"></script>
</footer>
</html>
