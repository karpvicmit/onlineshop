<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Anmelden')}"></head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-shop"></i> OnlineShop
        </a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Anmelden</h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Ungültige E-Mail oder Passwort.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Sie wurden erfolgreich abgemeldet.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-info">
                        Registrierung erfolgreich! Bitte melden Sie sich an.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">E-Mail-Adresse</label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Passwort</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p>Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a></p>
                    </div>

                    <div class="text-center my-3">
                        <span class="text-muted">oder</span>
                    </div>

                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center">
                        <i class="fab fa-google me-2"></i> Google
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
