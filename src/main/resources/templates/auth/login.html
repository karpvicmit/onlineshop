<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Login')}"></th:block>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Anmeldung</h4>
                </div>
                <div class="card-body">
                    <!-- Fehlermeldung bei falschen Daten -->
                    <div th:if="${param.error}" class="alert alert-danger">
                        Ungültige E-Mail oder Passwort.
                    </div>
                    <!-- Erfolgsmeldung nach Registrierung -->
                    <div th:if="${param.registered}" class="alert alert-success">
                        Registrierung erfolgreich! Bitte melden Sie sich an.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">E-Mail-Adresse</label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Passwort</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Anmelden</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <small>
                        Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
