<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anmelden – IBB Online Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/auth/login.css}"/>
</head>
<body>

<!-- ── Left decorative panel ──────────────────────────────── -->
<div class="panel-left">
    <a class="brand" th:href="@{/}">IBB Shop</a>
    <blockquote>
        <p>Qualität,<br/>die Sie<br/>spüren können.</p>
        <cite>IBB Online Shop</cite>
    </blockquote>
</div>

<!-- ── Login form panel ────────────────────────────────────── -->
<div class="panel-right">
    <div class="form-box">
        <h1>Willkommen zurück</h1>
        <p class="subtitle">Melden Sie sich mit Ihrem Konto an</p>

        <!-- Error message (wrong credentials) -->
        <div class="alert alert-error" th:if="${errorMessage}">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="#e05c5c" stroke-width="1.5"/>
                <path d="M8 5v3.5M8 11h.01" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Success message after logout -->
        <div class="alert alert-success" th:if="${successMessage}">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="#5cb88a" stroke-width="1.5"/>
                <path d="M5 8l2 2 4-4" stroke="#5cb88a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Success message after registration -->
        <div class="alert alert-success" th:if="${param.registered}">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="#5cb88a" stroke-width="1.5"/>
                <path d="M5 8l2 2 4-4" stroke="#5cb88a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Registrierung erfolgreich! Bitte melden Sie sich an.</span>
        </div>

        <!--
            Spring Security verarbeitet POST /login automatisch.
            Die Felder müssen 'username' und 'password' heißen (Standard-Konfiguration).
        -->
        <form th:action="@{/login}" method="post">
            <!-- CSRF Token (Thymeleaf + Spring Security injizieren es automatisch) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="username">E-Mail-Adresse</label>
                <input id="username"
                       type="email"
                       name="username"
                       placeholder="name@beispiel.de"
                       autocomplete="email"
                       required/>
            </div>

            <div class="field">
                <label for="password">Passwort</label>
                <input id="password"
                       type="password"
                       name="password"
                       placeholder="••••••••"
                       autocomplete="current-password"
                       required/>
            </div>

            <div class="row-options">
                <label class="check-label">
                    <input type="checkbox" name="remember-me"/> Angemeldet bleiben
                </label>
                <a class="forgot" th:href="@{/forgot-password}">Passwort vergessen?</a>
            </div>

            <button class="btn-primary" type="submit">Anmelden</button>
        </form>

        <div class="divider">oder</div>

        <p class="register-link">
            Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a>
        </p>
    </div>
</div>

</body>
</html>
