<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrieren – IBB Online Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/auth/register.css}"/>
</head>
<body>

<!-- ── Left decorative panel ──────────────────────────────── -->
<div class="panel-left">
    <a class="brand" th:href="@{/}">IBB Shop</a>
    <div class="steps">
        <h2>In drei Schritten<br/>zum Einkaufserlebnis</h2>
        <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">
                <strong>Konto erstellen</strong>
                <span>Nur wenige Angaben notwendig</span>
            </div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">
                <strong>Produkte entdecken</strong>
                <span>Exklusive Angebote &amp; Neuheiten</span>
            </div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">
                <strong>Sicher bestellen</strong>
                <span>Schnelle Lieferung, einfache Retoure</span>
            </div>
        </div>
    </div>
</div>

<!-- ── Register form panel ─────────────────────────────────── -->
<div class="panel-right">
    <div class="form-box">
        <h1>Konto erstellen</h1>
        <p class="subtitle">Werden Sie Teil unserer Community</p>

        <!-- Global error (z.B. E-Mail bereits vergeben) -->
        <div class="alert alert-error" th:if="${errorMessage}">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="#e05c5c" stroke-width="1.5"/>
                <path d="M8 5v3.5M8 11h.01" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${registrationDto}" method="post" novalidate>
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- First name / Last name -->
            <div class="row-2">
                <div class="field">
                    <label for="firstName">Vorname</label>
                    <input id="firstName"
                           type="text"
                           th:field="*{firstName}"
                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                           placeholder="Max"
                           autocomplete="given-name"/>
                    <div class="field-error"
                         th:if="${#fields.hasErrors('firstName')}"
                         th:errors="*{firstName}"></div>
                </div>
                <div class="field">
                    <label for="lastName">Nachname</label>
                    <input id="lastName"
                           type="text"
                           th:field="*{lastName}"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                           placeholder="Mustermann"
                           autocomplete="family-name"/>
                    <div class="field-error"
                         th:if="${#fields.hasErrors('lastName')}"
                         th:errors="*{lastName}"></div>
                </div>
            </div>

            <!-- Email -->
            <div class="field">
                <label for="email">E-Mail-Adresse</label>
                <input id="email"
                       type="email"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       placeholder="name@beispiel.de"
                       autocomplete="email"/>
                <div class="field-error"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"></div>
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password">Passwort</label>
                <input id="password"
                       type="password"
                       th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       placeholder="Mind. 8 Zeichen"
                       autocomplete="new-password"
                       oninput="updateStrength(this.value)"/>
                <div class="field-error"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
                <div class="strength-wrap" id="strengthWrap" style="display:none">
                    <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill"></div></div>
                    <span class="strength-label" id="strengthLabel"></span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="field">
                <label for="confirmPassword">Passwort bestätigen</label>
                <input id="confirmPassword"
                       type="password"
                       th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       placeholder="Passwort wiederholen"
                       autocomplete="new-password"/>
                <div class="field-error"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}"></div>
            </div>

            <!-- AGB / Datenschutz -->
            <div class="check-row">
                <input type="checkbox" id="agb" name="agb" required/>
                <label for="agb" style="text-transform:none; letter-spacing:0; font-size:.85rem; color:var(--muted);">
                    Ich akzeptiere die
                    <a th:href="@{/agb}">Allgemeinen Geschäftsbedingungen</a>
                    und die
                    <a th:href="@{/datenschutz}">Datenschutzerklärung</a>.
                </label>
            </div>

            <button class="btn-primary" type="submit">Jetzt registrieren</button>
        </form>

        <p class="login-link">
            Bereits ein Konto? <a th:href="@{/login}">Anmelden</a>
        </p>
    </div>
</div>
<script th:src="@{/js/auth/register.js}"></script>
</body>
</html>
