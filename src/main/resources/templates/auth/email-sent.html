<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{auth.emailSent.title})}"></head>
<body class="auth-page">
<div class="auth-navbar">
    <a th:href="@{/}" class="auth-navbar-brand">
        <i class="bi bi-shop"></i>
        <span th:text="#{navbar.brand}">OnlineShop</span>
    </a>
</div>
<div class="auth-container">
    <div class="auth-branding">
        <div class="auth-branding-content">
            <div class="auth-branding-icon"><i class="bi bi-envelope-check"></i></div>
            <h2 th:text="#{auth.emailSent.branding.title}">Fast geschafft!</h2>
            <p th:text="#{auth.emailSent.branding.text}">Nur noch ein Schritt...</p>
            <div class="auth-branding-features">
                <div class="auth-branding-feature"><i class="bi bi-envelope"></i><span th:text="#{auth.emailSent.branding.f1}">Bestätigungs-E-Mail wurde gesendet</span></div>
                <div class="auth-branding-feature"><i class="bi bi-clock"></i><span th:text="#{auth.emailSent.branding.f2}">Der Link ist 24 Stunden gültig</span></div>
                <div class="auth-branding-feature"><i class="bi bi-shield-lock"></i><span th:text="#{auth.emailSent.branding.f3}">Sichere Verifizierung</span></div>
            </div>
        </div>
    </div>
    <div class="auth-form-panel">
        <div class="auth-form-wrapper">
            <div class="email-sent-content">
                <div class="email-sent-icon"><i class="bi bi-envelope-check"></i></div>
                <h2 class="email-sent-title" th:text="#{auth.emailSent.title}">Bestätigungs-E-Mail gesendet</h2>
                <p class="email-sent-text" th:text="#{auth.emailSent.text}">Wir haben eine Bestätigungs-E-Mail...</p>
                <div class="email-sent-tip">
                    <i class="bi bi-info-circle-fill"></i>
                    <div><span th:text="#{auth.emailSent.tip}">Tipp: Überprüfen Sie auch Ihren Spam-Ordner...</span></div>
                </div>
                <a th:href="@{/login}" class="auth-submit-btn">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span th:text="#{auth.emailSent.btn}">Zum Login</span>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
