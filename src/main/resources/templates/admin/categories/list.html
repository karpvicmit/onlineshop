<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Kategorieverwaltung')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Kategorieverwaltung</h2>
        <a th:href="@{/admin/categories/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Neue Kategorie
        </a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Beschreibung</th>
                        <th scope="col">Slug (URL)</th>
                        <th scope="col" class="text-center">Aktionen</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categories}">
                        <td th:text="${category.id}">1</td>
                        <td class="fw-bold" th:text="${category.name}">Name</td>
                        <td th:text="${category.description != null and !category.description.isEmpty()} ? ${category.description} : '-'">Beschreibung</td>
                        <td><code th:text="${category.slug}">slug</code></td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                                   class="btn btn-outline-primary" title="Bearbeiten">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
                                      method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('Möchten Sie diese Kategorie wirklich löschen?');">
                                    <button type="submit" class="btn btn-outline-danger" title="Löschen">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Keine Kategorien gefunden.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
