<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Kategorieverwaltung')}"></head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="mb-0"><i class="bi bi-tags text-success me-2"></i>Kategorieverwaltung</h2>
            <a th:href="@{/admin/categories/new}" class="btn btn-success">
                <i class="bi bi-plus-lg"></i> Neue Kategorie
            </a>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Beschreibung</th>
                            <th>Slug (URL)</th>
                            <th class="text-center">Aktionen</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="category : ${categories}">
                            <td th:text="${category.id}">1</td>
                            <td class="fw-bold" th:text="${category.name}">Name</td>
                            <td th:text="${category.description != null and !category.description.isEmpty()} ? ${category.description} : '-'">Beschreibung</td>
                            <td><code th:text="${category.slug}">slug</code></td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}" class="btn btn-outline-primary" title="Bearbeiten">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Möchten Sie diese Kategorie wirklich löschen?');">
                                        <button type="submit" class="btn btn-outline-danger" title="Löschen">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="5" class="text-center text-muted py-4">Keine Kategorien gefunden.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
