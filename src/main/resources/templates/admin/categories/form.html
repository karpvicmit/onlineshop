<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Kategorie bearbeiten')}"></head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="flex-grow-1 p-4">
        <h2 class="mb-4" th:text="${category.id == null} ? 'Neue Kategorie anlegen' : 'Kategorie bearbeiten'">Kategorie</h2>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="name" class="form-label">Kategoriename *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Beschreibung</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                    </div>
                </div>

                <div class="col-md-6">
                    <!-- Der Slug wird automatisch im Service generiert, hier nur zur Info anzeigen -->
                    <div class="mb-3" th:if="${category.slug != null}">
                        <label class="form-label">Slug (automatisch generiert)</label>
                        <input type="text" class="form-control bg-light" th:value="${category.slug}" readonly>
                        <div class="form-text">Wird beim Speichern automatisch aus dem Namen erzeugt.</div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-success">Speichern</button>
                <a th:href="@{/admin/categories}" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
