<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Benutzerverwaltung')}"></head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="mb-0"><i class="bi bi-people text-secondary me-2"></i>Benutzerverwaltung</h2>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>E-Mail</th>
                            <th class="text-center">Rolle</th>
                            <th class="text-center">Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.firstName + ' ' + user.lastName}">Max Mustermann</td>
                            <td th:text="${user.email}">max@email.de</td>

                            <td class="text-center">
                                <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-inline">
                                    <select name="newRole" class="form-select form-select-sm"
                                            style="width: 120px; display: inline-block;"
                                            onchange="this.form.submit()"
                                            th:disabled="${user.id == currentUserId}">
                                        <option value="USER" th:selected="${user.role.name() == 'USER'}">USER</option>
                                        <option value="ADMIN" th:selected="${user.role.name() == 'ADMIN'}">ADMIN</option>
                                    </select>
                                </form>
                            </td>

                            <td class="text-center">
                                <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" class="d-inline">
                                    <select name="newStatus" class="form-select form-select-sm"
                                            style="width: 130px; display: inline-block;"
                                            onchange="this.form.submit()"
                                            th:disabled="${user.id == currentUserId}">
                                        <option value="ACTIVE" th:selected="${user.status.name() == 'ACTIVE'}">AKTIV</option>
                                        <option value="BLOCKED" th:selected="${user.status.name() == 'BLOCKED'}">GESPERRT</option>
                                    </select>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" class="text-center text-muted py-4">Keine Benutzer gefunden.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
