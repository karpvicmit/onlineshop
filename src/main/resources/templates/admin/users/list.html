<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" th:replace="~{admin/layout :: #sidebarMenu}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Benutzerverwaltung</h1>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name / E-Mail</th>
                                <th>Rolle</th>
                                <th>Status</th>
                                <th>Aktionen</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td>
                                    <div class="fw-bold" th:text="${user.firstName + ' ' + user.lastName}">Max Mustermann</div>
                                    <small class="text-muted" th:text="${user.email}">email@example.com</small>
                                </td>

                                <td>
                                    <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-flex">
                                        <select name="role" class="form-select form-select-sm me-2" style="width: 100px;">
                                            <option th:each="r : ${roles}"
                                                    th:value="${r}"
                                                    th:text="${r}"
                                                    th:selected="${user.role == r}">ROLE</option>
                                        </select>
                                        <button type="submit" class="btn btn-outline-primary btn-sm">
                                            <i class="fas fa-save"></i>
                                        </button>
                                    </form>
                                </td>

                                <td>
                                    <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" class="d-flex">
                                        <select name="status" class="form-select form-select-sm me-2" style="width: 110px;"
                                                th:classappend="${user.status.name() == 'BLOCKED'} ? 'border-danger text-danger'">
                                            <option th:each="s : ${statuses}"
                                                    th:value="${s}"
                                                    th:text="${s}"
                                                    th:selected="${user.status == s}">STATUS</option>
                                        </select>
                                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                                            <i class="fas fa-sync-alt"></i>
                                        </button>
                                    </form>
                                </td>

                                <td>
                                    <span th:if="${user.status.name() == 'BLOCKED'}" class="badge bg-danger">GESPERRT</span>
                                    <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success">AKTIV</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
