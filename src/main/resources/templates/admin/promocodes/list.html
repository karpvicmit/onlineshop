<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{admin.promocodes.title})}"></head>
<body>
<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>
    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1 class="admin-page-title">
                    <i class="bi bi-tag-fill"></i>
                    <span th:text="#{admin.promocodes.title}">Promo-Codes</span>
                </h1>
                <p class="admin-page-subtitle">
                    <span th:text="#{admin.promocodes.subtitle(${promoCodes.size()})}">0 Promo-Codes erstellt</span>
                </p>
            </div>
            <div class="admin-page-actions">
                <a th:href="@{/admin/promocodes/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> <span th:text="#{admin.promocodes.btn.new}">Neuer Promo-Code</span>
                </a>
            </div>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th th:text="#{admin.promocodes.table.code}">Code</th>
                    <th th:text="#{admin.promocodes.table.discount}">Rabatt</th>
                    <th th:text="#{admin.promocodes.table.minOrder}">Min. Bestellwert</th>
                    <th class="text-center" th:text="#{admin.promocodes.table.uses}">Verwendungen</th>
                    <th th:text="#{admin.promocodes.table.validFrom}">Gültig von</th>
                    <th th:text="#{admin.promocodes.table.validUntil}">Gültig bis</th>
                    <th class="text-center" th:text="#{admin.promocodes.table.status}">Status</th>
                    <th class="text-center" th:text="#{admin.promocodes.table.actions}">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="promo : ${promoCodes}">
                    <td>
                        <code style="font-size: var(--text-sm); font-weight: 700; color: var(--color-accent);"
                              th:text="${promo.code}">CODE</code>
                    </td>
                    <td>
                        <span th:if="${promo.discountType.name() == 'PERCENTAGE'}"
                              class="status-badge" style="background-color: #e7f3ff; color: #0d6efd;">
                            <span th:text="${promo.discountValue}">10</span>%
                        </span>
                        <span th:if="${promo.discountType.name() == 'FIXED'}"
                              class="status-badge" style="background-color: #fdf8ed; color: var(--color-warning);">
                            <span th:text="${#numbers.formatDecimal(promo.discountValue, 1, 2)}">10.00</span> €
                        </span>
                    </td>
                    <td class="text-muted">
                        <span th:if="${promo.minOrderAmount != null}"
                              th:text="${#numbers.formatDecimal(promo.minOrderAmount, 1, 2)} + ' €'">50.00 €</span>
                        <span th:unless="${promo.minOrderAmount != null}">—</span>
                    </td>
                    <td class="text-center">
                        <span style="font-weight: 600;" th:text="${promo.usedCount}">0</span>
                        <span th:if="${promo.maxUses != null}" class="text-muted">
                            / <span th:text="${promo.maxUses}">100</span>
                        </span>
                    </td>
                    <td class="text-muted small"
                        th:text="${#temporals.format(promo.validFrom, 'dd.MM.yyyy')}">01.01.2026</td>
                    <td class="text-muted small">
                        <span th:if="${promo.validUntil != null}"
                              th:text="${#temporals.format(promo.validUntil, 'dd.MM.yyyy')}">31.12.2026</span>
                        <span th:unless="${promo.validUntil != null}" th:text="#{admin.promocodes.unlimited}">Unbegrenzt</span>
                    </td>
                    <td class="text-center">
                        <form th:action="@{/admin/promocodes/toggle/{id}(id=${promo.id})}" method="post" class="d-inline">
                            <button type="submit" class="status-badge"
                                    style="cursor: pointer; border: none; font-family: var(--font-sans);"
                                    th:styleappend="${promo.currentlyActive} ? 'background-color: #f0f7f0; color: var(--color-success);' : 'background-color: var(--color-bg-alt); color: var(--color-text-muted);'"
                                    th:title="${promo.currentlyActive} ? #{admin.promocodes.status.deactivate.title} : #{admin.promocodes.status.activate.title}">
                                <i th:class="${promo.currentlyActive} ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'"></i>
                                <span th:text="${promo.currentlyActive} ? #{admin.promocodes.status.active} : #{admin.promocodes.status.inactive}">Status</span>
                            </button>
                        </form>
                    </td>
                    <td class="text-center">
                        <div class="action-buttons">
                            <a th:href="@{/admin/promocodes/edit/{id}(id=${promo.id})}"
                               class="action-btn" th:title="#{common.edit}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/promocodes/delete/{id}(id=${promo.id})}" method="post" class="d-inline"
                                  th:attr="onsubmit=|return confirm('#{admin.promocodes.delete.confirm}');|">
                                <button type="submit" class="action-btn action-btn-danger" th:title="#{common.delete}">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(promoCodes)}">
                    <td colspan="8">
                        <div class="admin-empty-state">
                            <div class="admin-empty-icon">
                                <i class="bi bi-tag-fill"></i>
                            </div>
                            <h3 class="admin-empty-title" th:text="#{admin.promocodes.empty.title}">Keine Promo-Codes vorhanden</h3>
                            <p class="admin-empty-text" th:text="#{admin.promocodes.empty.text}">Erstellen Sie Ihren ersten Promo-Code.</p>
                            <a th:href="@{/admin/promocodes/new}" class="btn btn-primary">
                                <i class="bi bi-plus-lg"></i> <span th:text="#{admin.promocodes.empty.btn}">Promo-Code anlegen</span>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
