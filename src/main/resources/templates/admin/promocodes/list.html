<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Promo-Codes')}"></head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="mb-0"><i class="bi bi-tag-fill text-success me-2"></i>Promo-Codes</h2>
            <a th:href="@{/admin/promocodes/new}" class="btn btn-success">
                <i class="bi bi-plus-lg"></i> Neuer Promo-Code
            </a>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Code</th>
                            <th>Rabatt</th>
                            <th>Min. Bestellwert</th>
                            <th class="text-center">Verwendungen</th>
                            <th>Gültig von</th>
                            <th>Gültig bis</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Aktionen</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="promo : ${promoCodes}">
                            <td>
                                <code class="fs-6 fw-bold text-primary" th:text="${promo.code}">CODE</code>
                            </td>
                            <td>
                                <span th:if="${promo.discountType.name() == 'PERCENTAGE'}"
                                      class="badge bg-info text-dark">
                                    <span th:text="${promo.discountValue}">10</span>%
                                </span>
                                <span th:if="${promo.discountType.name() == 'FIXED'}"
                                      class="badge bg-warning text-dark">
                                    <span th:text="${#numbers.formatDecimal(promo.discountValue, 1, 2)}">10.00</span> €
                                </span>
                            </td>
                            <td>
                                <span th:if="${promo.minOrderAmount != null}"
                                      th:text="${#numbers.formatDecimal(promo.minOrderAmount, 1, 2)} + ' €'">50.00 €</span>
                                <span th:unless="${promo.minOrderAmount != null}" class="text-muted">—</span>
                            </td>
                            <td class="text-center">
                                <span th:text="${promo.usedCount}">0</span>
                                <span th:if="${promo.maxUses != null}" class="text-muted">
                                    / <span th:text="${promo.maxUses}">100</span>
                                </span>
                            </td>
                            <td>
                                <small th:text="${#temporals.format(promo.validFrom, 'dd.MM.yyyy')}">01.01.2026</small>
                            </td>
                            <td>
                                <small th:if="${promo.validUntil != null}"
                                       th:text="${#temporals.format(promo.validUntil, 'dd.MM.yyyy')}">31.12.2026</small>
                                <small th:unless="${promo.validUntil != null}" class="text-muted">Unbegrenzt</small>
                            </td>
                            <td class="text-center">
                                <form th:action="@{/admin/promocodes/toggle/{id}(id=${promo.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${promo.currentlyActive} ? 'btn-success' : 'btn-secondary'"
                                            th:title="${promo.currentlyActive} ? 'Deaktivieren' : 'Aktivieren'">
                                        <i th:class="${promo.currentlyActive} ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'"></i>
                                        <span th:text="${promo.currentlyActive} ? 'Aktiv' : 'Inaktiv'">Status</span>
                                    </button>
                                </form>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/admin/promocodes/edit/{id}(id=${promo.id})}"
                                       class="btn btn-outline-primary" title="Bearbeiten">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/promocodes/delete/{id}(id=${promo.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Möchten Sie diesen Promo-Code wirklich löschen?');">
                                        <button type="submit" class="btn btn-outline-danger" title="Löschen">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(promoCodes)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                Keine Promo-Codes vorhanden.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
