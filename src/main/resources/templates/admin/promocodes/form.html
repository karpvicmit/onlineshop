<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${promoCode.id == null} ? #{admin.promocodes.form.title.new} : #{admin.promocodes.form.title.edit})}"></head>
<body>
<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>
    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1 class="admin-page-title">
                    <i class="bi bi-tag-fill"></i>
                    <span th:text="${promoCode.id == null} ? #{admin.promocodes.form.title.new} : #{admin.promocodes.form.title.edit}">Promo-Code</span>
                </h1>
            </div>
            <div class="admin-page-actions">
                <a th:href="@{/admin/promocodes}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.promocodes.form.back}">Zurück</span>
                </a>
            </div>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <form th:action="@{/admin/promocodes/save}" th:object="${promoCode}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); align-items: start;">
                <!-- Left: Basic Data -->
                <div class="admin-form-card">
                    <div class="admin-form-header">
                        <i class="bi bi-tag-fill"></i>
                        <span th:text="#{admin.promocodes.form.basic}">Grunddaten</span>
                    </div>
                    <div class="admin-form-body">
                        <div class="admin-form-group">
                            <label for="code" class="admin-form-label" th:text="#{admin.promocodes.form.code}">Promo-Code *</label>
                            <input type="text" class="admin-form-input" id="code" th:field="*{code}"
                                   required placeholder="z.B. SAVE10" style="text-transform: uppercase;">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                            <p class="admin-form-hint" th:text="#{admin.promocodes.form.code.hint}">Wird automatisch in Großbuchstaben umgewandelt.</p>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                            <div class="admin-form-group">
                                <label for="discountType" class="admin-form-label" th:text="#{admin.promocodes.form.discountType}">Rabatt-Typ *</label>
                                <select class="admin-form-select" id="discountType" th:field="*{discountType}" required>
                                    <option th:each="type : ${discountTypes}"
                                            th:value="${type}"
                                            th:text="${type == T(com.karpenko.onlineshop.entity.DiscountType).PERCENTAGE} ? #{admin.promocodes.form.discountType.PERCENTAGE} : #{admin.promocodes.form.discountType.FIXED}">
                                        Typ
                                    </option>
                                </select>
                            </div>
                            <div class="admin-form-group">
                                <label for="discountValue" class="admin-form-label" th:text="#{admin.promocodes.form.discountValue}">Rabatt-Wert *</label>
                                <input type="number" step="0.01" min="0" class="admin-form-input"
                                       id="discountValue" th:field="*{discountValue}" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></div>
                            </div>
                        </div>
                        <div class="admin-form-group">
                            <label for="minOrderAmount" class="admin-form-label" th:text="#{admin.promocodes.form.minOrderAmount}">Mindestbestellwert (€)</label>
                            <input type="number" step="0.01" min="0" class="admin-form-input"
                                   id="minOrderAmount" th:field="*{minOrderAmount}"
                                   th:placeholder="#{admin.promocodes.form.minOrderAmount.placeholder}">
                            <p class="admin-form-hint" th:text="#{admin.promocodes.form.minOrderAmount.hint}">Promo-Code ist nur gültig ab diesem Bestellwert.</p>
                        </div>
                    </div>
                </div>
                <!-- Right: Validity & Limits -->
                <div style="display: flex; flex-direction: column; gap: var(--space-6);">
                    <div class="admin-form-card">
                        <div class="admin-form-header">
                            <i class="bi bi-calendar-event"></i>
                            <span th:text="#{admin.promocodes.form.validity}">Gültigkeit & Limits</span>
                        </div>
                        <div class="admin-form-body">
                            <div class="admin-form-group">
                                <label for="validFrom" class="admin-form-label" th:text="#{admin.promocodes.form.validFrom}">Gültig von *</label>
                                <input type="datetime-local" class="admin-form-input" id="validFrom"
                                       th:field="*{validFrom}" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('validFrom')}" th:errors="*{validFrom}"></div>
                            </div>
                            <div class="admin-form-group">
                                <label for="validUntil" class="admin-form-label" th:text="#{admin.promocodes.form.validUntil}">Gültig bis</label>
                                <input type="datetime-local" class="admin-form-input" id="validUntil"
                                       th:field="*{validUntil}">
                                <p class="admin-form-hint" th:text="#{admin.promocodes.form.validUntil.hint}">Leer lassen für unbegrenzte Gültigkeit.</p>
                            </div>
                            <div class="admin-form-group">
                                <label for="maxUses" class="admin-form-label" th:text="#{admin.promocodes.form.maxUses}">Maximale Verwendungen</label>
                                <input type="number" min="1" class="admin-form-input" id="maxUses"
                                       th:field="*{maxUses}" th:placeholder="#{admin.promocodes.form.maxUses.placeholder}">
                                <p class="admin-form-hint" th:text="#{admin.promocodes.form.maxUses.hint}">Leer lassen für unbegrenzte Nutzung.</p>
                            </div>
                            <div class="admin-form-group" style="margin-bottom: 0;">
                                <div style="display: flex; align-items: center; gap: var(--space-3);">
                                    <input class="form-check-input" type="checkbox" id="active" th:field="*{active}"
                                           style="width: 18px; height: 18px; accent-color: var(--color-accent);">
                                    <label for="active" style="font-weight: 600; cursor: pointer;" th:text="#{admin.promocodes.form.active}">
                                        Promo-Code ist aktiv
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Stats (only for existing codes) -->
                    <div th:if="${promoCode.id != null}" class="admin-form-card">
                        <div class="admin-form-header">
                            <i class="bi bi-bar-chart-fill"></i>
                            <span th:text="#{admin.promocodes.form.stats}">Statistiken</span>
                        </div>
                        <div class="admin-form-body">
                            <div class="profile-info-row">
                                <span class="profile-info-label" th:text="#{admin.promocodes.form.usedCount}">Bereits verwendet</span>
                                <span class="profile-info-value" style="font-weight: 700;" th:text="${promoCode.usedCount}">0</span>
                            </div>
                            <div class="profile-info-row" th:if="${promoCode.maxUses != null}" style="border-bottom: none;">
                                <span class="profile-info-label" th:text="#{admin.promocodes.form.remaining}">Verbleibend</span>
                                <span class="profile-info-value" style="font-weight: 700; color: var(--color-success);"
                                      th:text="${promoCode.maxUses - promoCode.usedCount}">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="admin-form-actions" style="margin-top: var(--space-6);">
                <a th:href="@{/admin/promocodes}" class="btn btn-outline-secondary" th:text="#{admin.promocodes.form.cancel}">Abbrechen</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> <span th:text="#{admin.promocodes.form.save}">Speichern</span>
                </button>
            </div>
        </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('code').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });
</script>
</body>
</html>
