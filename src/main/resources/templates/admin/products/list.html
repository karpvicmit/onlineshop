<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Produktverwaltung')}"></head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="mb-0"><i class="bi bi-box-seam text-primary me-2"></i>Produktverwaltung</h2>
            <a th:href="@{/admin/products/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Neues Produkt
            </a>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Bild</th>
                            <th>Name</th>
                            <th>Kategorie</th>
                            <th class="text-end">Preis</th>
                            <th class="text-center">Lager</th>
                            <th class="text-center">Aktionen</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${productPage}">
                            <td th:text="${product.id}">1</td>
                            <td>
                                <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                                     th:src="@{${product.imageUrl}}" alt="Produktbild"
                                     class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;">
                                <span th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}" class="text-muted small">Kein Bild</span>
                            </td>
                            <td th:text="${product.name}">Produktname</td>
                            <td th:text="${product.categoryName != null and !product.categoryName.isEmpty()} ? ${product.categoryName} : '-'">Kategorie</td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">0.00 €</td>
                            <td class="text-center">
                                <span th:class="${product.stock <= 5} ? 'badge bg-danger' : 'badge bg-success'" th:text="${product.stock}">0</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-outline-primary" title="Bearbeiten">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Möchten Sie dieses Produkt wirklich löschen?');">
                                        <button type="submit" class="btn btn-outline-danger" title="Löschen">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productPage)}">
                            <td colspan="7" class="text-center text-muted py-4">Keine Produkte gefunden.</td>
                        </tr>
                        </tbody>
                    </table>
                    <div th:replace="~{fragments/pagination :: pagination(page=${productPage}, baseUrl=${baseUrl})}"></div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
