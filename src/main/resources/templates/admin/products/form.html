<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Produkt bearbeiten')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2 th:text="${product.id == null} ? 'Neues Produkt anlegen' : 'Produkt bearbeiten'">Produkt</h2>

    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="name" class="form-label">Produktname *</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Kategorie *</label>
            <select class="form-select" id="category" th:field="*{category.id}" required>
                <option value="">Bitte wählen...</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Kategorie</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Preis (€) *</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="price" th:field="*{price}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="stock" class="form-label">Lagerbestand *</label>
                <input type="number" min="0" class="form-control" id="stock" th:field="*{stock}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Produktbild</label>
            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/png, image/jpeg">
            <div class="form-text">Maximale Dateigröße: 5MB. Formate: JPG, PNG.</div>
        </div>

        <div class="mb-3" th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}">
            <label class="form-label">Aktuelles Bild</label><br>
            <img th:src="@{${product.imageUrl}}" alt="Produktbild" style="max-height: 150px;" class="img-thumbnail">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Beschreibung</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a th:href="@{/admin/products}" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
