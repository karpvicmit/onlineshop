<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{admin.orders.title})}"></head>
<body>
<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>
    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1 class="admin-page-title"><i class="bi bi-receipt"></i><span th:text="#{admin.orders.title}">Bestellverwaltung</span></h1>
                <p class="admin-page-subtitle"><span th:text="#{admin.orders.subtitle(${orderPage.totalElements})}">0 Bestellungen insgesamt</span></p>
            </div>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th th:text="#{admin.orders.table.orderNr}">Bestell-Nr.</th>
                    <th th:text="#{admin.orders.table.customer}">Kunde</th>
                    <th th:text="#{admin.orders.table.date}">Datum</th>
                    <th th:text="#{admin.orders.table.payment}">Zahlungsart</th>
                    <th class="text-end" th:text="#{admin.orders.table.total}">Gesamtsumme</th>
                    <th th:text="#{admin.orders.table.status}">Status</th>
                    <th th:text="#{admin.orders.table.paymentStatus}">Zahlung</th>
                    <th class="text-center" th:text="#{admin.orders.table.actions}">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td style="font-weight: 700;" th:text="'#' + ${order.id}">#1</td>
                    <td th:text="${order.user != null ? order.user.email : #{common.guest}}">kunde@email.de</td>
                    <td class="text-muted" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                    <td><span class="status-badge" th:text="${order.paymentMethod != null ? order.paymentMethod.displayName : '-'}">Vorkasse</span></td>
                    <td class="text-end" style="font-weight: 700;" th:text="${#numbers.formatDecimal(order.grandTotal, 1, 2)} + ' €'">0.00 €</td>
                    <td>
                        <span th:switch="${order.status}" class="status-badge">
                            <span th:case="'NEW'" class="status-badge status-badge-new" th:text="#{orderStatus.NEW}">NEU</span>
                            <span th:case="'CONFIRMED'" class="status-badge status-badge-confirmed" th:text="#{orderStatus.CONFIRMED}">BESTÄTIGT</span>
                            <span th:case="'SHIPPED'" class="status-badge status-badge-shipped" th:text="#{orderStatus.SHIPPED}">VERSENDET</span>
                            <span th:case="'CANCELLED'" class="status-badge status-badge-cancelled" th:text="#{orderStatus.CANCELLED}">STORNIERT</span>
                        </span>
                    </td>
                    <td>
                        <span th:switch="${order.paymentStatus}" class="status-badge">
                            <span th:case="'PENDING'" class="status-badge status-badge-pending" th:text="#{paymentStatus.PENDING}">OFFEN</span>
                            <span th:case="'SUCCEEDED'" class="status-badge status-badge-succeeded" th:text="#{paymentStatus.SUCCEEDED}">BEZAHLT</span>
                            <span th:case="'FAILED'" class="status-badge status-badge-cancelled" th:text="#{paymentStatus.FAILED}">FEHLGESCHLAGEN</span>
                        </span>
                    </td>
                    <td class="text-center">
                        <div class="action-buttons" style="flex-wrap: wrap;">
                            <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" class="action-btn" th:title="#{orders.card.details}"><i class="bi bi-eye"></i></a>
                            <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-inline">
                                <select name="status" class="admin-form-select" style="width: 130px; padding: 0.375rem 0.5rem; font-size: var(--text-xs);" onchange="this.form.submit()" th:disabled="${order.status == 'CANCELLED' or order.status == 'SHIPPED'}">
                                    <option value="" disabled selected th:text="#{admin.orders.status.placeholder}">Status...</option>
                                    <option value="CONFIRMED" th:text="#{admin.orders.status.CONFIRMED}">Bestätigen</option>
                                    <option value="SHIPPED" th:text="#{admin.orders.status.SHIPPED}">Versenden</option>
                                    <option value="CANCELLED" th:text="#{admin.orders.status.CANCELLED}">Stornieren</option>
                                </select>
                            </form>
                            <form th:if="${order.paymentProvider?.name() == 'RECHNUNG' and order.paymentStatus?.name() == 'PENDING'}" th:action="@{/admin/orders/{id}/mark-as-paid(id=${order.id})}" method="post" class="d-inline" th:attr="onclick=|return confirm('#{admin.orders.markAsPaid.confirm(${order.id})}');|">
                                <button type="submit" class="action-btn action-btn-success" th:title="#{admin.orders.markAsPaid.btn}"><i class="bi bi-cash-coin"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="8"><div class="admin-empty-state"><div class="admin-empty-icon"><i class="bi bi-receipt"></i></div><h3 class="admin-empty-title" th:text="#{admin.orders.empty.title}">Keine Bestellungen gefunden</h3></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
