<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bestellverwaltung')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковая панель админа -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" th:replace="~{admin/layout :: #sidebarMenu}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Bestellverwaltung</h1>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Kunde</th>
                                <th>Datum</th>
                                <th>Betrag</th>
                                <th>Status ändern</th>
                                <th>Aktionen</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${orders}">
                                <td th:text="'#' + ${order.id}">#123</td>
                                <td>
                                    <div th:text="${order.user.email}">user@email.com</div>
                                    <small class="text-muted" th:text="${order.deliveryAddress}">Adresse</small>
                                </td>
                                <td th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                                <td class="fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')} + ' €'">0.00 €</td>

                                <!-- Форма смены статуса -->
                                <td>
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex">
                                        <select name="status" class="form-select form-select-sm me-2" style="width: 150px;">
                                            <option th:each="s : ${statuses}"
                                                    th:value="${s}"
                                                    th:text="${s}"
                                                    th:selected="${order.status == s}">STATUS</option>
                                        </select>
                                        <button type="submit" class="btn btn-outline-primary btn-sm">
                                            <i class="fas fa-sync-alt"></i>
                                        </button>
                                    </form>
                                </td>

                                <td>
                                    <a th:href="@{/shop/orders/{id}(id=${order.id})}" target="_blank" class="btn btn-sm btn-outline-secondary" title="Details ansehen">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
