<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Analyse-Dashboard')}"></head>
<body>
<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1 class="admin-page-title">
                    <i class="bi bi-graph-up-arrow"></i>
                    Analyse & Statistik
                </h1>
                <p class="admin-page-subtitle">Umsatzentwicklung und Top-Produkte</p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Charts Row -->
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-6); margin-bottom: var(--space-8);">
            <!-- Revenue Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <i class="bi bi-graph-up me-2"></i>Umsatzentwicklung (monatlich)
                </div>
                <div class="chart-body">
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Status Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <i class="bi bi-pie-chart me-2"></i>Bestellstatus
                </div>
                <div class="chart-body">
                    <div class="chart-container">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top Products Table -->
        <div class="admin-table-wrapper">
            <div class="admin-form-header">
                <i class="bi bi-trophy"></i>
                Top 10 meistverkaufte Produkte
            </div>
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width: 60px;">#</th>
                    <th>Produktname</th>
                    <th class="text-end">Verkaufte Menge</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prod, iterStat : ${topProducts}">
                    <td>
                            <span style="display: inline-flex; align-items: center; justify-content: center;
                                         width: 28px; height: 28px; border-radius: var(--radius-full);
                                         background-color: var(--color-bg-alt); font-weight: 700;
                                         font-size: var(--text-sm);"
                                  th:text="${iterStat.index + 1}">1</span>
                    </td>
                    <td style="font-weight: 500;" th:text="${prod.productName}">Produkt</td>
                    <td class="text-end" style="font-weight: 700;" th:text="${prod.totalQuantitySold}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(topProducts)}">
                    <td colspan="3">
                        <div class="admin-empty-state">
                            <div class="admin-empty-icon">
                                <i class="bi bi-trophy"></i>
                            </div>
                            <h3 class="admin-empty-title">Noch keine Verkaufsdaten</h3>
                            <p class="admin-empty-text">Sobald Bestellungen eingehen, erscheinen hier die Top-Produkte.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        const revenueData = /*[[${revenueData}]]*/ [];
        const statusData = /*[[${statusCounts}]]*/ [];

        new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: revenueData.map(d => d.month),
                datasets: [{
                    label: 'Umsatz (€)',
                    data: revenueData.map(d => d.totalRevenue),
                    borderColor: '#8B7355',
                    backgroundColor: 'rgba(139, 115, 85, 0.1)',
                    tension: 0.3,
                    fill: true,
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: '#8B7355'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                    x: { grid: { display: false } }
                }
            }
        });

        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: statusData.map(d => d.status),
                datasets: [{
                    data: statusData.map(d => d.count),
                    backgroundColor: ['#A8A29E', '#5B7C5A', '#6B8E9B', '#A0522D'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } }
                },
                cutout: '65%'
            }
        });
    });
    /*]]>*/
</script>
</body>
</html>
