<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Analyse-Dashboard')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" th:replace="~{admin/layout :: #sidebarMenu}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="fas fa-chart-line me-2"></i>Analyse-Dashboard</h1>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">Umsatzentwicklung (Monatlich)</div>
                <div class="card-body">
                    <canvas id="revenueChart" height="80"></canvas>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white fw-bold">Top-10 Produkte (Verkaufsmenge)</div>
                        <div class="card-body">
                            <canvas id="topProductsChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white fw-bold">Bestellungen nach Status</div>
                        <div class="card-body">
                            <canvas id="orderStatusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">

    const revenueData = /*[[${revenueData}]]*/ [];
    const revenueLabels = revenueData.map(d => d.month + '/' + d.year);
    const revenueValues = revenueData.map(d => parseFloat(d.totalRevenue));

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: revenueLabels.reverse(),
            datasets: [{
                label: 'Umsatz in €',
                data: revenueValues.reverse(),
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true,
                tension: 0.3
            }]
        },
        options: { responsive: true }
    });

    const topProducts = /*[[${topProducts}]]*/ [];
    new Chart(document.getElementById('topProductsChart'), {
        type: 'bar',
        data: {
            labels: topProducts.map(p => p.productName),
            datasets: [{
                label: 'Verkaufte Menge',
                data: topProducts.map(p => p.totalQuantitySold),
                backgroundColor: '#198754'
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true
        }
    });

    const statusCounts = /*[[${statusCounts}]]*/ [];
    new Chart(document.getElementById('orderStatusChart'), {
        type: 'doughnut',
        data: {
            labels: statusCounts.map(s => s.status),
            datasets: [{
                data: statusCounts.map(s => s.count),
                backgroundColor: ['#0dcaf0', '#0d6efd', '#198754', '#dc3545']
            }]
        },
        options: { responsive: true }
    });

    /*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
