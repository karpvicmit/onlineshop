<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Analyse-Dashboard')}"></head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="mb-0"><i class="bi bi-graph-up-arrow text-dark me-2"></i>Analyse & Statistik</h2>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row g-4 mb-5">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white fw-bold">Umsatzentwicklung (monatlich)</div>
                    <div class="card-body">
                        <div class="chart-container" style="position: relative; height: 300px; width: 100%;">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-success text-white fw-bold">Bestellstatus</div>
                    <div class="card-body">
                        <div class="chart-container" style="position: relative; height: 300px; width: 100%;">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold">Top 10 meistverkaufte Produkte</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Produktname</th>
                            <th class="text-end">Verkaufte Menge</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="prod, iterStat : ${topProducts}">
                            <td th:text="${iterStat.index + 1}">1</td>
                            <td th:text="${prod.productName}">Produkt</td>
                            <td class="text-end fw-bold" th:text="${prod.totalQuantitySold}">0</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(topProducts)}">
                            <td colspan="3" class="text-center text-muted py-4">Noch keine Verkaufsdaten vorhanden.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        const revenueData = /*[[${revenueData}]]*/ [];
        const statusData = /*[[${statusCounts}]]*/ [];

        new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: revenueData.map(d => d.month),
                datasets: [{
                    label: 'Umsatz (€)',
                    data: revenueData.map(d => d.totalRevenue),
                    borderColor: '#0d6efd',
                    backgroundColor: 'rgba(13, 110, 253, 0.1)',
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });

        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: statusData.map(d => d.status),
                datasets: [{
                    data: statusData.map(d => d.count),
                    backgroundColor: ['#6c757d', '#198754', '#0dcaf0', '#dc3545']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    });
    /*]]>*/
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
