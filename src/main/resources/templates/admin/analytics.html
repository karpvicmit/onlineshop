<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{admin.analytics.title})}"></head>
<body>
<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>
    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1 class="admin-page-title"><i class="bi bi-graph-up-arrow"></i><span th:text="#{admin.analytics.title}">Analyse & Statistik</span></h1>
                <p class="admin-page-subtitle" th:text="#{admin.analytics.subtitle}">Umsatzentwicklung und Top-Produkte</p>
            </div>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-6); margin-bottom: var(--space-8);">
            <div class="chart-card">
                <div class="chart-header"><i class="bi bi-graph-up me-2"></i><span th:text="#{admin.analytics.revenue.title}">Umsatzentwicklung (monatlich)</span></div>
                <div class="chart-body"><div class="chart-container"><canvas id="revenueChart"></canvas></div></div>
            </div>
            <div class="chart-card">
                <div class="chart-header"><i class="bi bi-pie-chart me-2"></i><span th:text="#{admin.analytics.status.title}">Bestellstatus</span></div>
                <div class="chart-body"><div class="chart-container"><canvas id="statusChart"></canvas></div></div>
            </div>
        </div>
        <div class="admin-table-wrapper">
            <div class="admin-form-header"><i class="bi bi-trophy"></i><span th:text="#{admin.analytics.topProducts.title}">Top 10 meistverkaufte Produkte</span></div>
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width: 60px;" th:text="#{admin.analytics.topProducts.rank}">#</th>
                    <th th:text="#{admin.analytics.topProducts.name}">Produktname</th>
                    <th class="text-end" th:text="#{admin.analytics.topProducts.sold}">Verkaufte Menge</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prod, iterStat : ${topProducts}">
                    <td><span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--radius-full); background-color: var(--color-bg-alt); font-weight: 700; font-size: var(--text-sm);" th:text="${iterStat.index + 1}">1</span></td>
                    <td style="font-weight: 500;" th:text="${prod.productName}">Produkt</td>
                    <td class="text-end" style="font-weight: 700;" th:text="${prod.totalQuantitySold}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(topProducts)}">
                    <td colspan="3">
                        <div class="admin-empty-state">
                            <div class="admin-empty-icon"><i class="bi bi-trophy"></i></div>
                            <h3 class="admin-empty-title" th:text="#{admin.analytics.empty.title}">Noch keine Verkaufsdaten</h3>
                            <p class="admin-empty-text" th:text="#{admin.analytics.empty.text}">Sobald Bestellungen eingehen, erscheinen hier die Top-Produkte.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        const revenueData = /*[[${revenueData}]]*/ [];
        const statusData = /*[[${statusCounts}]]*/ [];
        // ... (остальной JS код без изменений)
    });
    /*]]>*/
</script>
</body>
</html>
