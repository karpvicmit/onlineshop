<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}"></head>
<body class="bg-light"> 
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary"><i class="bi bi-speedometer2"></i> Admin-Dashboard</h2>
        <span class="badge bg-warning text-dark">Administrator-Modus</span>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-primary">
                <div class="card-body text-center">
                    <i class="bi bi-box-seam display-4 text-primary mb-3"></i>
                    <h5 class="card-title">Produktverwaltung</h5>
                    <p class="card-text">Produkte anlegen, bearbeiten, Bilder verwalten.</p>
                    <a th:href="@{/admin/products}" class="btn btn-primary">Verwalten</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-success">
                <div class="card-body text-center">
                    <i class="bi bi-tags display-4 text-success mb-3"></i>
                    <h5 class="card-title">Kategorieverwaltung</h5>
                    <p class="card-text">Kategorien und Slugs organisieren.</p>
                    <a th:href="@{/admin/categories}" class="btn btn-success">Verwalten</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-info">
                <div class="card-body text-center">
                    <i class="bi bi-receipt display-4 text-info mb-3"></i>
                    <h5 class="card-title">Bestellverwaltung</h5>
                    <p class="card-text">Bestellungen einsehen und Status ändern.</p>
                    <a th:href="@{/admin/orders}" class="btn btn-info text-white">Verwalten</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
