<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" th:replace="~{admin/layout :: #sidebarMenu}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Dashboard Übersicht</h1>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card text-white bg-primary h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-box me-2"></i>Produkte</h5>
                            <p class="card-text fs-4">Verwalten Sie den gesamten Katalog.</p>
                            <a th:href="@{/admin/products}" class="btn btn-light btn-sm">Zur Verwaltung</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white bg-success h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-shopping-bag me-2"></i>Bestellungen</h5>
                            <p class="card-text fs-4">Neue Eingänge und Statusänderungen.</p>
                            <a th:href="@{/admin/orders}" class="btn btn-light btn-sm">Zur Übersicht</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white bg-warning h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-chart-pie me-2"></i>Analysen</h5>
                            <p class="card-text fs-4">Umsatz und Top-Produkte im Blick.</p>
                            <a th:href="@{/admin/analytics}" class="btn btn-light btn-sm">Zum Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
