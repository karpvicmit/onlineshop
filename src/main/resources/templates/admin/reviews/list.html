<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bewertungen moderieren')}"></head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="mb-0"><i class="bi bi-chat-left-text text-warning me-2"></i>Offene Bewertungen</h2>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div th:if="${reviews.isEmpty()}" class="alert alert-success">
            <i class="bi bi-check-circle me-2"></i> Keine offenen Bewertungen. Alles ist moderiert!
        </div>

        <div th:if="${!reviews.isEmpty()}" class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Produkt</th>
                        <th>Kunde</th>
                        <th>Rating</th>
                        <th>Titel / Kommentar</th>
                        <th>Datum</th>
                        <th class="text-center">Aktionen</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="review : ${reviews}">
                        <td th:text="${review.product.name}">Produkt</td>
                        <td th:text="${review.user.email}">user@email.de</td>
                        <td>
                            <span class="text-warning" th:text="${'★'.repeat(review.rating)}">★★★★★</span>
                        </td>
                        <td>
                            <strong th:text="${review.title}">Titel</strong><br>
                            <small class="text-muted" th:text="${review.comment}">Kommentar...</small>
                        </td>
                        <td th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</td>
                        <td class="text-center">
                            <form th:action="@{/admin/reviews/{id}/approve(id=${review.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-success" title="Genehmigen">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/reviews/{id}/reject(id=${review.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bewertung wirklich ablehnen und löschen?');">
                                <button type="submit" class="btn btn-sm btn-danger" title="Ablehnen">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
