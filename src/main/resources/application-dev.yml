spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onlineshop_db}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:onlineshop_user}
    password: ${DB_PASSWORD:SecurePassword_2026!}

app:
  upload-dir: ./dev-uploads

logging:
  level:
    com.karpenko.onlineshop: DEBUG
    org.hibernate.SQL: DEBUG